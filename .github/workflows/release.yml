# .github/workflows/release.yml

name: Create Multi-Platform Release


on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Flutter for Linux
        working-directory: ${{ github.workspace }}/Frontend
        run: flutter build linux --release

      - name: Package in .tar.gz
        run: |
          mkdir -p release_package/bin
          cp -r ./bin/* release_package/bin/
          cp -r ./frontend/build/linux/x64/release/bundle/* release_package/
          tar -czvf deep-search-linux-${{ github.ref_name }}.tar.gz release_package

      - name: Package in .deb
        run: |
          VERSION=${{ github.ref_name }}
          DEB_VERSION=${VERSION#v}
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin/deep-search
          echo "Package: deep-search" > deb_package/DEBIAN/control
          echo "Version: ${DEB_VERSION}" >> deb_package/DEBIAN/control
          echo "Architecture: amd64" >> deb_package/DEBIAN/control
          echo "Maintainer: Polad Maharramli <mu312933@email.com>" >> deb_package/DEBIAN/control
          echo "Description: DeepSearch is a high-performance local semantic search engine." >> deb_package/DEBIAN/control
          cp -r ./bin/* deb_package/usr/local/bin/deep-search/
          cp -r ./frontend/build/linux/x64/release/bundle/* deb_package/usr/local/bin/deep-search/
          dpkg-deb --build deb_package
          mv deb_package.deb deep-search-linux-${{ github.ref_name }}.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            deep-search-linux-*.tar.gz
            deep-search-linux-*.deb


  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for macOS
        working-directory: ./frontend
        run: flutter build macos --release

      - name: Package for macOS
        run: |
          mkdir -p release_package
          cp -r frontend/build/macos/Build/Products/Release/frontend.app release_package/
          cp -r ./bin release_package/frontend.app/Contents/Resources/
          zip -r deep-search-macos-${{ github.ref_name }}.zip release_package

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: deep-search-macos-*.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Flutter for Windows
        working-directory: ./frontend
        run: flutter build windows --release

      - name: Package for Windows
        run: |
          mkdir release_package
          cp -r ./bin release_package/
          cp -r ./frontend/build/windows/runner/Release/* release_package/
          Compress-Archive -Path ./release_package/* -DestinationPath deep-search-windows-${{ github.ref_name }}.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: deep-search-windows-*.zip


  create-release:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
