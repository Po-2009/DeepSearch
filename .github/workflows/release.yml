# .github/workflows/release.yml

name: Create Multi-Platform Release


on:
  push:
    tags:
      - 'v*.*.*'

jobs:

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build Flutter for Linux
        working-directory: ${{ github.workspace }}/Frontend
        run: flutter build linux --release

      - name: Package in .tar.gz
        run: |
          mkdir -p release_package/bin
          cp -r ./bin/* release_package/bin/
          cp -r ./Frontend/build/linux/x64/release/bundle/* release_package/
          tar -czvf deep-search-linux-${{ github.ref_name }}.tar.gz release_package

      - name: Package in .deb
        run: |
          VERSION=${{ github.ref_name }}
          DEB_VERSION=${VERSION#v}
          mkdir -p deb_package/DEBIAN
          mkdir -p deb_package/usr/local/bin/deep-search
          echo "Package: deep-search" > deb_package/DEBIAN/control
          echo "Version: ${DEB_VERSION}" >> deb_package/DEBIAN/control
          echo "Architecture: amd64" >> deb_package/DEBIAN/control
          echo "Maintainer: Polad Maharramli <mu312933@email.com>" >> deb_package/DEBIAN/control
          echo "Description: DeepSearch is a high-performance local semantic search engine." >> deb_package/DEBIAN/control
          cp -r ./bin/* deb_package/usr/local/bin/deep-search/
          cp -r ./Frontend/build/linux/x64/release/bundle/* deb_package/usr/local/bin/deep-search/
          dpkg-deb --build deb_package
          mv deb_package.deb deep-search-linux-${{ github.ref_name }}.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            deep-search-linux-*.tar.gz
            deep-search-linux-*.deb


  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Import Code-Signing Certificates
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$MACOS_CERTIFICATE_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$MACOS_CERTIFICATE_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_CERTIFICATE_PASSWORD" build.keychain

      - name: Build Flutter for macOS
        working-directory: ./Frontend
        run: flutter build macos --release

      - name: Sign, Notarize and Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |

          APP_PATH="./frontend/build/macos/Build/Products/Release/DeepSearch.app"
          
          ZIP_PATH_DIR="$(dirname "$APP_PATH")"
          (cd "$ZIP_PATH_DIR" && ditto -c -k --sequesterRsrc --keepParent "DeepSearch.app" "DeepSearch.zip")
          
          xcrun notarytool submit "$ZIP_PATH_DIR/DeepSearch.zip" --apple-id "$APPLE_ID" --password "$APP_PASSWORD" --team-id "$TEAM_ID" --wait

          for attempt in $(seq 1 5); do
            if xcrun stapler staple "$APP_PATH"; then
              break
            elif [ "$attempt" -lt 5 ]; then
              sleep 60
            else
              exit 1
            fi
          done

          DMG_NAME="DeepSearch_${{ github.ref_name }}_macOS.dmg"
          create-dmg \
            --volname "DeepSearch Installer" \
            --window-pos 200 120 --window-size 600 420 \
            --icon-size 128 --icon "DeepSearch.app" 170 250 \
            --hide-extension "DeepSearch.app" \
            --app-drop-link 430 250 \
            "$DMG_NAME" \
            "$APP_PATH"
          echo "DMG_PATH=$DMG_NAME" >> $GITHUB_ENV

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ${{ env.DMG_PATH }}


  create-release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
